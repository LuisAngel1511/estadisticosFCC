<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Dashboard Estadísticos SS / PP - FCC</title>

  <!-- Plotly (CDN) -->
  <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>

  <style>
    body { font-family: Arial, sans-serif; margin: 16px; }
    .card {
      border: 1px solid #ddd; border-radius: 10px; padding: 12px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.08); background: #fff;
      margin-bottom: 16px;
    }
    .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: end; }
    select, button, input {
      padding: 8px; border-radius: 8px; border: 1px solid #ccc;
      min-width: 240px;
    }
    button { min-width: auto; cursor: pointer; }
    #chart { width: 100%; min-height: 560px; }
    .muted { color: #666; font-size: 13px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { border-bottom: 1px solid #eee; padding: 8px; text-align: left; }
    th { background: #fafafa; position: sticky; top: 0; }
    .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
    @media (max-width: 1100px) { .grid { grid-template-columns: 1fr; } }
    .error { color: #b00020; font-weight: bold; }
    .ok { color: #1b5e20; font-weight: bold; }
  </style>
</head>

<body>
  <h2>Dashboard de Estadísticos SS / PP</h2>
  <p class="muted">
    Visualiza promedios por empresa para cada rubro. El valor <b>n</b> indica cuántos alumnos aportan al promedio.
  </p>

  <div class="card row">
    <div>
      <label><b>Tipo</b></label><br/>
      <select id="tipoSelect">
        <option value="SS">SS</option>
        <option value="PP">PP</option>
      </select>
    </div>

    <div>
      <label><b>Rubro</b></label><br/>
      <select id="rubroSelect"></select>
    </div>

    <div>
      <label><b>Buscar empresa</b> <span class="muted">(opcional)</span></label><br/>
      <input id="searchInput" placeholder="Ej. Facultad de Ciencias..." />
    </div>

    <div>
      <button id="refreshBtn">Actualizar</button><br/>
      <span id="status" class="muted"></span>
    </div>

    <div class="muted" id="meta"></div>
  </div>

  <div class="grid">
    <div class="card">
      <div id="chart"></div>
    </div>
    <div class="card" style="max-height: 620px; overflow:auto;">
      <h3 style="margin-top:0;">Top / Bottom</h3>
      <div id="topBottom"></div>
    </div>
  </div>

  <script>
    // =========================
    // CONFIG: CAMBIA ESTA URL
    // =========================
    // Ejemplo: https://estadisticos-fcc-api.onrender.com
    const API_BASE = "https://estadisticosfcc.onrender.com";

    const tipoSelect = document.getElementById("tipoSelect");
    const rubroSelect = document.getElementById("rubroSelect");
    const searchInput = document.getElementById("searchInput");
    const refreshBtn = document.getElementById("refreshBtn");
    const statusEl = document.getElementById("status");
    const metaEl = document.getElementById("meta");

    const TOPN = 5;

    function setStatus(msg, kind) {
      statusEl.className = kind === "error" ? "error" : (kind === "ok" ? "ok" : "muted");
      statusEl.textContent = msg;
    }

    async function apiGet(path) {
      const url = API_BASE.replace(/\/$/, "") + path;
      const res = await fetch(url, { method: "GET" });
      if (!res.ok) {
        const txt = await res.text();
        throw new Error("HTTP " + res.status + " - " + txt);
      }
      return await res.json();
    }

    async function loadRubros() {
      setStatus("Cargando rubros...", "");
      const rubros = await apiGet("/rubros");
      rubroSelect.innerHTML = "";
      for (let i = 0; i < rubros.length; i++) {
        const opt = document.createElement("option");
        opt.value = rubros[i].id;            // R01..R15
        opt.textContent = rubros[i].id + " - " + rubros[i].nombre;
        rubroSelect.appendChild(opt);
      }
      if (rubros.length > 0) rubroSelect.value = rubros[0].id;
      setStatus("Rubros cargados.", "ok");
    }

    function filterRows(rows) {
      const q = (searchInput.value || "").trim().toLowerCase();
      if (!q) return rows;

      return rows.filter(r => (r.empresa || "").toLowerCase().includes(q));
    }

    function renderChart(rows, tipo, rubroId) {
      // datos para grafica
      const empresas = [];
      const promedios = [];
      const textos = [];
      let totalReg = 0;

      for (let i = 0; i < rows.length; i++) {
        empresas.push(rows[i].empresa);
        promedios.push(rows[i].promedio);
        textos.push("n=" + rows[i].n);
        totalReg += rows[i].n;
      }

      metaEl.innerHTML =
        "<b>Empresas:</b> " + rows.length +
        " &nbsp; | &nbsp; <b>Registros (suma n):</b> " + totalReg;

      const trace = {
        type: "bar",
        orientation: "h",
        y: empresas.slice().reverse(),
        x: promedios.slice().reverse(),
        text: textos.slice().reverse(),
        hovertemplate:
          "<b>%{y}</b><br>" +
          "Promedio: %{x}<br>" +
          "%{text}<extra></extra>"
      };

      const layout = {
        title: tipo + " - Promedio por empresa - " + rubroId,
        margin: { l: 260, r: 30, t: 50, b: 50 },
        xaxis: { title: "Promedio" },
        yaxis: { title: "Empresa", automargin: true },
        height: Math.max(560, 16 * Math.min(rows.length, 60) + 200)
      };

      Plotly.newPlot("chart", [trace], layout, { displayModeBar: true });
    }

    function renderTopBottom(rows) {
      const top = rows.slice(0, TOPN);
      const bottom = rows.slice(Math.max(rows.length - TOPN, 0));

      function makeTable(title, arr) {
        let html = "<h4 style='margin-bottom:8px;'>" + title + "</h4>";
        html += "<table><thead><tr><th>Empresa</th><th>Promedio</th><th>n</th></tr></thead><tbody>";
        for (let i = 0; i < arr.length; i++) {
          html += "<tr><td>" + arr[i].empresa + "</td><td>" +
                  Number(arr[i].promedio).toFixed(2) + "</td><td>" +
                  arr[i].n + "</td></tr>";
        }
        html += "</tbody></table>";
        return html;
      }

      document.getElementById("topBottom").innerHTML =
        makeTable("Top " + TOPN, top) + "<br/>" + makeTable("Bottom " + TOPN, bottom);
    }

    async function refresh() {
      const tipo = tipoSelect.value;
      const rubroId = rubroSelect.value;

      if (!rubroId) {
        setStatus("No hay rubros disponibles.", "error");
        return;
      }

      setStatus("Consultando estadísticas...", "");
      try {
        const rows = await apiGet("/stats?tipo=" + encodeURIComponent(tipo) + "&rubro_id=" + encodeURIComponent(rubroId));
        const filtered = filterRows(rows);

        if (!rows || rows.length === 0) {
          setStatus("No hay datos para esa combinación (tipo/rubro).", "error");
          Plotly.purge("chart");
          document.getElementById("topBottom").innerHTML = "";
          metaEl.textContent = "";
          return;
        }

        if (filtered.length === 0) {
          setStatus("La búsqueda no encontró empresas. Borra el texto de búsqueda.", "error");
          Plotly.purge("chart");
          document.getElementById("topBottom").innerHTML = "";
          metaEl.textContent = "";
          return;
        }

        setStatus("Listo.", "ok");
        renderChart(filtered, tipo, rubroId);
        renderTopBottom(filtered);

      } catch (err) {
        setStatus("Error consultando API: " + err.message, "error");
        Plotly.purge("chart");
        document.getElementById("topBottom").innerHTML = "";
        metaEl.textContent = "";
      }
    }

    // Eventos
    tipoSelect.addEventListener("change", refresh);
    rubroSelect.addEventListener("change", refresh);
    refreshBtn.addEventListener("click", refresh);
    searchInput.addEventListener("input", () => {
      // refiltra sin pegarle a la API (usando refresh vuelve a pedir)
      // aquí lo más simple es solo llamar refresh para recalcular todo (es rápido)
      refresh();
    });

    // Inicialización
    (async function init() {
      try {
        // opcional: ping health
        await apiGet("/health");
        setStatus("API conectada.", "ok");
      } catch (_) {
        setStatus("No se pudo conectar a la API. Revisa API_BASE.", "error");
      }

      try {
        await loadRubros();
        await refresh();
      } catch (err) {
        setStatus("Error inicial: " + err.message, "error");
      }
    })();
  </script>
</body>
</html>
